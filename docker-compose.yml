services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - FAST_REFRESH=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Media import endpoints. These are read by CRA at build/start and baked
      # into the bundle, so they must be URLs the *browser* (not the container)
      # can reach. The app tries yt-dlp first (most capable), then cobalt, then
      # the external fallback proxy.
      - REACT_APP_YTDLP_API=http://localhost:9001
      - REACT_APP_COBALT_API=http://localhost:9000
      - REACT_APP_FALLBACK_API=https://ytproxy.critfail.art
    depends_on:
      - cobalt
      - ytdlp
    command: sh -c "npm install --legacy-peer-deps && npm start"

  # yt-dlp download API (https://github.com/yt-dlp/yt-dlp). The app POSTs a link
  # plus {mode: audio|video} and gets the media bytes streamed back. Supports far
  # more sites than cobalt and extracts audio cleanly, so it's the primary path.
  ytdlp:
    build:
      context: ./ytdlp-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    container_name: ytdlp-api
    ports:
      - "9001:9001/tcp"

  # Self-hosted cobalt download API (https://github.com/imputnet/cobalt).
  # The app POSTs a video URL here and gets back a tunnel/stream URL to fetch.
  cobalt:
    image: ghcr.io/imputnet/cobalt:10
    init: true
    read_only: true
    restart: unless-stopped
    container_name: cobalt-api
    ports:
      - "9000:9000/tcp"
    environment:
      # Must match the URL the browser uses to reach this container, because
      # cobalt builds its tunnel download URLs from it.
      API_URL: "http://localhost:9000/"
      # CORS is wildcard by default, so the dev app at localhost:3000 can call it.
